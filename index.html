<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumer Portal - VASDHAVITRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
  apiKey: "AIzaSyAeS1uWLuEYaBLUeLm6vHUUXkjHxLzyK4g",
  authDomain: "vasdhavitra.firebaseapp.com",
  projectId: "vasdhavitra",
  storageBucket: "vasdhavitra.firebasestorage.app",
  messagingSenderId: "1088106081732",
  appId: "1:1088106081732:web:8b9d6c2814dc31b1b20891"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.firebaseDoc = doc;
        window.firebaseSetDoc = setDoc;
        window.firebaseGetDoc = getDoc;
    </script>
    <script>
        (function(){
            emailjs.init("8w88p-CTlu6764M0V"); 
        })();
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; color: #4A3B32; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full bg-[#F5EFEB] border-b border-[#E6DCD0] py-4 px-6 flex justify-between items-center">
        <a href="home.html" class="flex items-center gap-3">
            <img src="logo.jpeg" alt="VASDHAVITRA Logo" class="h-10 w-auto object-contain" onerror="this.src='https://placehold.co/100x100/f4efe6/3e2723?text=V'">
            <span class="font-serif text-xl font-bold tracking-wider text-[#5C4033]">VASDHAVITRA</span>
        </a>
        <a href="home.html" class="text-sm font-semibold text-[#8B5A2B] hover:underline">← Back to Store</a>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-[#E6DCD0] p-8">
            
            <!-- Tabs -->
            <div class="flex border-b border-[#E6DCD0] mb-6">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 pb-3 text-center font-bold text-[#5C4033] border-b-2 border-[#8B5A2B]">Login</button>
                <button onclick="switchTab('signup')" id="tab-signup" class="flex-1 pb-3 text-center font-semibold text-[#A67B5B]">Sign Up</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div id="login-success-banner" class="hidden bg-emerald-50 text-emerald-900 p-3 rounded-lg text-xs font-semibold mb-2 text-center border border-emerald-200">
                    🎉 Email verified successfully! Please log in with your account.
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C4033] mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2 border border-[#D7CCC8] rounded-lg focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-[#FAFAFA]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C4033] mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border border-[#D7CCC8] rounded-lg focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-[#FAFAFA]">
                </div>
                <button type="submit" class="w-full bg-[#8B5A2B] text-white py-3 rounded-lg font-semibold hover:bg-[#6F441E] transition shadow-md">Login to Store</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="form-signup" onsubmit="handleSignup(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-[#5C4033] mb-1">Full Name</label>
                    <input type="text" id="signup-name" required class="w-full px-4 py-2 border border-[#D7CCC8] rounded-lg focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-[#FAFAFA]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C4033] mb-1">Gmail / Email Address</label>
                    <input type="email" id="signup-email" placeholder="name@gmail.com" required class="w-full px-4 py-2 border border-[#D7CCC8] rounded-lg focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-[#FAFAFA]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C4033] mb-1">Password</label>
                    <input type="password" id="signup-password" required class="w-full px-4 py-2 border border-[#D7CCC8] rounded-lg focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-[#FAFAFA]">
                </div>
                <button type="submit" id="signup-submit-btn" class="w-full bg-[#8B5A2B] text-white py-3 rounded-lg font-semibold hover:bg-[#6F441E] transition shadow-md">Create Account & Send Verification</button>
            </form>

            <!-- VERIFICATION CODE SECTION -->
            <div id="verification-section" class="hidden space-y-4 mt-4 pt-4 border-t border-[#E6DCD0]">
                <div class="bg-[#F5EFEB] p-4 rounded-lg text-center">
                    <p class="text-sm font-semibold text-[#5C4033]">Verification Code Sent!</p>
                    <p id="sent-notice" class="text-xs text-[#8B5A2B] mt-1">Please check your inbox for the 6-digit code.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-[#5C4033] mb-1">Enter 6-Digit Code</label>
                    <input type="text" id="verification-code-input" maxlength="6" placeholder="123456" class="w-full px-4 py-2 text-center text-xl tracking-widest border border-[#D7CCC8] rounded-lg focus:ring-2 focus:ring-[#8B5A2B] outline-none bg-[#FAFAFA]">
                </div>
                <button onclick="verifyEmailCode()" class="w-full bg-[#5C4033] text-white py-3 rounded-lg font-semibold hover:bg-[#3E2723] transition shadow-md">Verify & Proceed to Login</button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-[#8B5A2B] bg-[#F5EFEB] border-t border-[#E6DCD0]">
        &copy; 2026 VASDHAVITRA – A Woven Breeze. All rights reserved.
    </footer>

    <script>
        let generatedCode = '';
        let pendingUser = {};

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const verifySec = document.getElementById('verification-section');

            verifySec.classList.add('hidden');
            document.getElementById('login-success-banner').classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = "flex-1 pb-3 text-center font-bold text-[#5C4033] border-b-2 border-[#8B5A2B]";
                tabSignup.className = "flex-1 pb-3 text-center font-semibold text-[#A67B5B]";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabSignup.className = "flex-1 pb-3 text-center font-bold text-[#5C4033] border-b-2 border-[#8B5A2B]";
                tabLogin.className = "flex-1 pb-3 text-center font-semibold text-[#A67B5B]";
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            
            let userObj = {
                name: email.split('@')[0],
                email: email,
                phone: '',
                address: '',
                verified: true,
                role: 'consumer'
            };

            if (window.db) {
                try {
                    const docSnap = await window.firebaseGetDoc(window.firebaseDoc(window.db, "users", email.toLowerCase()));
                    if (docSnap.exists()) {
                        userObj = docSnap.data();
                    }
                } catch(err) { console.error(err); }
            }

            localStorage.setItem('vas_current_user', JSON.stringify(userObj));
            alert('Login successful! Redirecting to VASDHAVITRA Woven Breeze...');
            window.location.href = 'home.html';
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            pendingUser = { name, email, password, phone: '', address: '', verified: true, role: 'consumer' };

            const btn = document.getElementById('signup-submit-btn');
            btn.innerText = "Sending Code to " + email + "...";
            btn.disabled = true;

            emailjs.send("service_fvkwp6a", "template_m0s6lyd", {
                to_name: name,
                to_email: email,
                verification_code: generatedCode
            }).then(() => {
                document.getElementById('form-signup').classList.add('hidden');
                document.getElementById('verification-section').classList.remove('hidden');
                document.getElementById('sent-notice').innerText = `Verification code successfully dispatched to ${email}. Check your inbox!`;
                btn.innerText = "Create Account & Send Verification";
                btn.disabled = false;
            }, (error) => {
                alert('Email transmission failed. Please verify your EmailJS keys.');
                console.error('EmailJS Error:', error);
                btn.innerText = "Create Account & Send Verification";
                btn.disabled = false;
            });
        }

        async function verifyEmailCode() {
            const enteredCode = document.getElementById('verification-code-input').value.trim();
            if (enteredCode === generatedCode) {
                if (window.db) {
                    try {
                        await window.firebaseSetDoc(window.firebaseDoc(window.db, "users", pendingUser.email.toLowerCase()), pendingUser);
                    } catch(e) { console.error(e); }
                }

                alert('Email verified successfully! Please log in to continue.');
                switchTab('login');
                document.getElementById('login-email').value = pendingUser.email;
                document.getElementById('login-success-banner').classList.remove('hidden');
            } else {
                alert('Invalid verification code. Please check your inbox.');
            }
        }
    </script>
</body>
</html>
